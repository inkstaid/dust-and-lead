<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 960, H = 540, GY = 450, TAU = Math.PI * 2;
const GRAV = 2000, RUN = 250, JUMP = 760;
const STAND_H = 54, CROUCH_H = 38;
const MAX_HP = 10;               // counted in half-hearts: five hearts, so 4-5 hits and you're down
const REV_MAX = 48, SG_MAX = 12; // the most spare revolver rounds / shotgun shells you can carry
const C = {
  sky0:'#2B1E3F', sky1:'#5B2A4E', sky2:'#B83A36', sky3:'#E8683A', sky4:'#FFB050', sun:'#FFD98A',
  peaks:'#5A3050', peaksLit:'#8A4A62', mesa:'#6E2A2E', mesaLit:'#B04A38', hill:'#2E1A26', hillLit:'#5A2E34', pine:'#1E1220',
  rim:'#FFB35C', rimEnemy:'#D0613F', paper:'#EAD9B8', gold:'#E8C170', blood:'#B3261E', win:'#F4B45C'
};

// ---------- canvas ----------
const cvs = document.getElementById('game'), out = cvs.getContext('2d');
// the game is drawn on a 640x360 pixel canvas (see the pixel renderer below), then scaled up to the window
const PW = 640, PH = 360;
const pcv = document.createElement('canvas'); pcv.width = PW; pcv.height = PH;
const pctx = pcv.getContext('2d');
let ctx = pctx;
// the camera shows 640x360 world units: one world unit is one pixel. ZOOM converts the 960x540 layout (mouse) to pixels
const ZOOM = W / PW, VW = PW, VH = PH;
const CAM_TOP = -260, CAM_BOT = GY + 36 - VH;                     // camera height range; low enough that rooftop snipers clear the HUD strip
let dpr = 1;
function resize() { // a whole-number scale whenever that still fills most of the window, so every pixel is the same size
  dpr = window.devicePixelRatio || 1;
  const fit = Math.min(innerWidth * dpr / PW, innerHeight * dpr / PH), whole = Math.floor(fit);
  const k = whole >= 1 && whole / fit >= 0.85 ? whole : fit;
  cvs.width = Math.max(1, Math.round(PW * k)); cvs.height = Math.max(1, Math.round(PH * k));
  cvs.style.width = cvs.width / dpr + 'px'; cvs.style.height = cvs.height / dpr + 'px';
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function segRect(x1, y1, x2, y2, r) {
  let t0 = 0, t1 = 1; const dx = x2 - x1, dy = y2 - y1;
  const p = [-dx, dx, -dy, dy], q = [x1 - r.x, r.x + r.w - x1, y1 - r.y, r.y + r.h - y1];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return null; }
    else { const t = q[i] / p[i]; if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; } else { if (t < t0) return null; if (t < t1) t1 = t; } }
  }
  return t0;
}

// ---------- state ----------
let state = 'title', time = 0, timeScale = 1, stateT = 0;
let camX = 0, camY = 0, camFeet = GY, shake = 0, hurtFlash = 0;
let solids = [], oneways = [], buildings = [], signs = [], decor = [], pickups = [], enemies = [], checkpoints = [];
let bullets = [], parts = [], marksFx = [], weeds = [];
let player = null, cpIndex = -1, savedCash = 0, cash = 0;
let stats = null, bossIntro = false, bossDead = false, boss = null;
let msg = { text: '', sub: '', t: 0 }, nameCard = 0, weedT = 0;
let aimSrc = 'mouse', hitstop = 0, chests = [], savedKit = null;
// the level: Dry Creek. Ladders and lasso hooks are supported by the engine, though Dry Creek doesn't place any yet
let LW = 7400, LV = null, ladders = [], hooks = [], poles = [];
let gotLasso = false, lassoFx = null;
// shooting: shots fly the way you face, Contra style
const settings = { aim: 'straight' };
function toggleAim() {
  settings.aim = settings.aim === 'mouse' ? 'straight' : 'mouse';
  try { localStorage.setItem('dustlead.aim', settings.aim); } catch (e) {}
  sfx.mark();
}

// ---------- input ----------
const keys = {}, pressed = {};
const mouse = { x: W / 2, y: H / 2, down: false, clicked: false };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true; keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });
function toLogical(e) { const r = cvs.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
cvs.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { toLogical(e); aimSrc = 'mouse'; } });
cvs.addEventListener('pointerdown', e => {
  initAudio(); cvs.focus();
  if (e.pointerType !== 'mouse') { if (state !== 'play') mouse.clicked = true; }
  else if (e.button === 0) { toLogical(e); aimSrc = 'mouse'; mouse.down = true; mouse.clicked = true; }
});
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') { if (e.button === 0) mouse.down = false; } });
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ---------- gamepad (PS5 DualSense or any standard-mapping pad) ----------
// Cross 0, Circle 1, Square 2, Triangle 3, L1 4, L2 6, R2 7, Create 8, Options 9, D-pad 12-15 (up, down, left, right); right stick = axes 2/3
const pad = { gp: null, b: [], prev: [], lx: 0, ly: 0, rx: 0, ry: 0, was: false };
function pollPad() {
  pad.prev = pad.b; pad.b = []; pad.gp = null;
  for (const g of (navigator.getGamepads ? navigator.getGamepads() : [])) if (g && g.connected) { pad.gp = g; break; }
  const g = pad.gp;
  if (!g) {
    pad.lx = pad.ly = pad.rx = pad.ry = 0;
    if (pad.was) { pad.was = false; if (state === 'play') showMsg('Controller disconnected', '', 2); }
    return;
  }
  if (!pad.was) { pad.was = true; initAudio(); if (state === 'play') showMsg('Controller connected', 'R2 or Circle revolver  ·  Square shotgun  ·  Triangle knife', 3); }
  g.buttons.forEach((b, i) => { pad.b[i] = b.pressed || b.value > 0.4; });
  const dz = v => Math.abs(v || 0) < 0.2 ? 0 : v;
  pad.lx = dz(g.axes[0]); pad.ly = dz(g.axes[1]); pad.rx = dz(g.axes[2]); pad.ry = dz(g.axes[3]);
  if (pad.b.some(Boolean) || Math.hypot(pad.rx, pad.ry) > 0.4) aimSrc = 'pad';
}
const padDown = i => !!pad.b[i], padHit = i => !!pad.b[i] && !pad.prev[i];
function rumble(strong, weak, ms) {
  const a = pad.gp && pad.gp.vibrationActuator;
  if (a && a.playEffect) try { a.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); } catch (e) {}
}
// keyboard, mouse and pad merged into one set of actions each frame
let inp = {};
function readInput() {
  pollPad();
  const pl = pad.lx < -0.4 || padDown(14), pr = pad.lx > 0.4 || padDown(15), pd = pad.ly > 0.55 || padDown(13);
  inp = {
    left: keys.a || keys.arrowleft || pl, right: keys.d || keys.arrowright || pr, down: keys.s || keys.arrowdown || pd,
    jumpHeld: keys[' '] || keys.w || keys.arrowup || padDown(0),
    jump: pressed[' '] || pressed.w || pressed.arrowup || padHit(0),
    jumpBtn: pressed[' '] || padHit(0), upPress: pressed.w || pressed.arrowup,      // W / up climbs when you're at a ladder
    up: keys.w || keys.arrowup || padDown(12) || pad.ly < -0.55,
    lasso: pressed.c || padHit(5),                          // R1
    knife: pressed.z || padHit(3),                          // Triangle
    shotgun: pressed.v || padHit(2),                        // Square
    fire: pressed.x || mouse.clicked || padHit(7) || padHit(1), // R2 or Circle
    music: pressed.n || padHit(8),                          // Create
    reload: pressed.r || padHit(4),
    use: pressed.e,                                         // open a chest (Triangle / Z also work)
    pause: pressed.p || pressed.escape || padHit(9),
    confirm: mouse.clicked || pressed[' '] || pressed.enter || padHit(0) || padHit(9),
    toggle: pressed.m || pressed.arrowleft || pressed.arrowright || padHit(14) || padHit(15)
  };
}

// ---------- audio (all synthesized) ----------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // wind
    const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.7;
    const g = AC.createGain(); g.gain.value = 0.045;
    const l = AC.createOscillator(); l.frequency.value = 0.11; const lg = AC.createGain(); lg.gain.value = 260;
    l.connect(lg).connect(f.frequency); l.start(); n.connect(f).connect(g).connect(master); n.start();
    music.lp = AC.createBiquadFilter(); music.lp.type = 'lowpass'; music.lp.frequency.value = 14000;
    music.bus = AC.createGain(); music.bus.gain.value = 0; music.bus.connect(music.lp).connect(master);
    music.next = AC.currentTime + 0.1; setInterval(musicTick, 25);
  } catch (e) { AC = null; }
}
function noise(vol, f0, f1, dur, type = 'lowpass') {
  if (!AC) return; const t = AC.currentTime;
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f).connect(g).connect(master); n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.05);
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  shot() { noise(0.9, 2800, 180, 0.38); tone(150, 0.18, 'sine', 0.7, 0.25); },
  enemyShot(d) { const v = clamp(1 - d / 900, 0.15, 0.6); noise(v, 1800, 150, 0.32); tone(120, 0.15, 'sine', v * 0.6, 0.3); },
  rifle(d) { const v = clamp(1 - d / 1100, 0.15, 0.7); noise(v, 3500, 120, 0.6); tone(90, 0.3, 'sine', v * 0.6, 0.3); },
  click() { tone(1800, 0.03, 'square', 0.08); },
  dry() { tone(900, 0.04, 'square', 0.1); },
  reload() { for (let i = 0; i < 6; i++) tone(1300 + i * 40, 0.025, 'square', 0.06, 0, i * 0.15); tone(700, 0.06, 'square', 0.1, 0, 1.0); },
  ricochet() { tone(rnd(1800, 2600), 0.25, 'sine', 0.06, 0.4); },
  hit() { noise(0.35, 900, 200, 0.12); },
  hurt() { noise(0.5, 600, 80, 0.2); tone(70, 0.2, 'sine', 0.5, 0.6); },
  coin() { tone(1600, 0.08, 'triangle', 0.15); tone(2400, 0.15, 'triangle', 0.12, 0, 0.06); },
  gulp() { tone(300, 0.1, 'sine', 0.25, 0.6); tone(260, 0.12, 'sine', 0.25, 0.6, 0.12); },
  jump() { noise(0.12, 800, 300, 0.1); },
  land() { noise(0.18, 500, 100, 0.1); },
  mark() { tone(2200, 0.05, 'triangle', 0.12); },
  motif() { [392, 466, 523, 466, 392].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, 0, i * 0.18)); },
  win() { [294, 392, 440, 494, 587, 494, 587].forEach((f, i) => tone(f, 0.7, 'triangle', 0.14, 0, i * 0.22)); },
  death() { [220, 207, 196, 147].forEach((f, i) => tone(f, 0.9, 'triangle', 0.14, 0, i * 0.35)); },
  swish() { noise(0.22, 3500, 1200, 0.08, 'bandpass'); },
  stab() { noise(0.45, 1400, 200, 0.1); tone(110, 0.08, 'sine', 0.4, 0.5); },
  clink() { tone(2600, 0.08, 'square', 0.07, 0.6); noise(0.2, 6000, 2000, 0.06, 'highpass'); },
  blast() { noise(1, 1600, 60, 0.6); tone(80, 0.3, 'sine', 0.9, 0.35); },
  pump() { tone(900, 0.04, 'square', 0.1); tone(700, 0.05, 'square', 0.1, 0, 0.12); },
  lasso() { noise(0.25, 900, 3200, 0.22, 'bandpass'); tone(260, 0.12, 'triangle', 0.08, 1.6); },
  climb() { tone(600 + Math.random() * 120, 0.03, 'triangle', 0.05); },
  enemyReload(d) { const v = clamp(1 - d / 800, 0.1, 0.8); for (let i = 0; i < 3; i++) tone(1150 + i * 60, 0.025, 'square', 0.07 * v, 0, i * 0.13); },
  grunt() { noise(0.3, 700, 180, 0.12); },
  ammo() { tone(1500, 0.03, 'square', 0.08); tone(1150, 0.04, 'square', 0.08, 0, 0.07); },
  heal() { [660, 880].forEach((f, i) => tone(f, 0.18, 'triangle', 0.12, 0, i * 0.08)); },
  chest() { noise(0.2, 300, 1200, 0.35, 'bandpass'); [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 0, 0.12 + i * 0.07)); }
};

// ---------- music: a spaghetti-western score, all synthesized ----------
// Nylon-string guitar (Karplus-Strong plucks) playing boom-chick over the Andalusian cadence in A minor,
// a lonesome whistle and a harmonica trading the tune, horse-hoof clip-clops on the trail,
// and a faster, heavier take with drum and whip cracks for the showdown with Silas Crowe.
const music = { on: true, bus: null, lp: null, next: 0, step: 0, bpm: 100, bufs: {}, mode: 'title' };
try { if (localStorage.getItem('dustlead.music') === 'off') music.on = false; } catch (e) {}
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [ // bass root + fifth, then the strummed chord (MIDI notes): Am  G  F  E | Am  G  F  E7
  { b: [45, 52], c: [57, 60, 64] }, { b: [43, 50], c: [55, 59, 62] }, { b: [41, 48], c: [53, 57, 60] }, { b: [40, 47], c: [52, 56, 59] },
  { b: [45, 52], c: [57, 60, 64] }, { b: [43, 50], c: [55, 59, 62] }, { b: [41, 48], c: [53, 57, 60] }, { b: [40, 47], c: [52, 56, 59, 62] }
];
const MELODY = new Map([ // bar*16 + step -> [MIDI note, length in 16ths]
  [0, [76, 8]], [8, [81, 4]], [12, [79, 4]], [16, [74, 8]], [24, [71, 4]], [28, [74, 4]], [32, [72, 8]], [40, [69, 4]], [44, [72, 4]],
  [48, [71, 12]], [60, [68, 4]], [64, [69, 4]], [68, [72, 4]], [72, [76, 8]], [80, [74, 4]], [84, [71, 4]], [88, [67, 8]],
  [96, [81, 6]], [102, [79, 2]], [104, [77, 4]], [108, [76, 4]], [112, [76, 16]]
]);
function ksBuffer(m, dur) { // plucked string, rendered once per note and cached
  const sr = AC.sampleRate, n = Math.floor(sr * dur), buf = AC.createBuffer(1, n, sr), d = buf.getChannelData(0);
  const P = Math.max(2, Math.round(sr / NOTE(m))), ring = new Float32Array(P);
  for (let i = 0; i < P; i++) ring[i] = Math.random() * 2 - 1;
  for (let k = 0; k < 2; k++) for (let i = 1; i < P; i++) ring[i] = (ring[i] + ring[i - 1]) * 0.5; // soft nylon pick
  for (let i = 0, j = 0; i < n; i++) { const a = ring[j], b = ring[(j + 1) % P]; d[i] = a; ring[j] = (a + b) * 0.4985; j = (j + 1) % P; }
  for (let i = Math.max(0, n - 2000); i < n; i++) d[i] *= (n - i) / 2000;
  return buf;
}
function pluck(m, t, vol) {
  const b = music.bufs[m] || (music.bufs[m] = ksBuffer(m, m < 50 ? 2.2 : 1.6));
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(music.bus); s.start(t);
}
function strum(ch, t, vol, up) { (up ? [...ch].reverse() : ch).forEach((m, i) => pluck(m, t + i * 0.014, vol)); }
function whistle(m, t, dur, vol) {
  const f = NOTE(m), o = AC.createOscillator(), g = AC.createGain(), v = AC.createOscillator(), vg = AC.createGain();
  o.frequency.setValueAtTime(f * 0.96, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.08); // lip slide up to the note
  v.frequency.value = 5.3; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(f * 0.014, t + Math.min(dur, 0.5));
  v.connect(vg).connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
  g.gain.setValueAtTime(vol, t + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(music.bus); o.start(t); v.start(t); o.stop(t + dur + 0.05); v.stop(t + dur + 0.05);
}
function harmonica(m, t, dur, vol) {
  const f = NOTE(m), g = AC.createGain(), bp = AC.createBiquadFilter(), lp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = f * 2.2; bp.Q.value = 0.8; lp.type = 'lowpass'; lp.frequency.value = 3000;
  const v = AC.createOscillator(), vg = AC.createGain(); v.frequency.value = 6.2; vg.gain.value = f * 0.009; v.connect(vg);
  for (const [type, det] of [['sawtooth', 0], ['square', 8]]) {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    vg.connect(o.frequency); o.connect(bp); o.start(t); o.stop(t + dur + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
  g.gain.setValueAtTime(vol * 0.85, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  bp.connect(lp).connect(g).connect(music.bus); v.start(t); v.stop(t + dur + 0.05);
}
function hoof(t, hi, vol) { // coconut-shell clip-clop
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(hi ? 1150 : 850, t); o.frequency.exponentialRampToValueAtTime(hi ? 700 : 520, t + 0.035);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  o.connect(g).connect(music.bus); o.start(t); o.stop(t + 0.07);
}
function drum(t, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g).connect(music.bus); o.start(t); o.stop(t + 0.32);
}
function whip(t, vol) {

function update(rdt) {
  time += rdt; stateT += rdt;

  if (msg.t > 0) msg.t -= rdt;
  if (nameCard > 0) nameCard -= rdt;

  shake = Math.max(0, shake - rdt * 30);

  if (state === 'title') {

    updateWeeds(rdt); updateParts(rdt);
    if (pressed.h || padHit(3)) { state = 'sheet'; return; }
    if (pressed.l || padHit(2)) { openBoard(); return; }
    if (inp.confirm) { initAudio(); cpIndex = -1; startRun(-1); }
    return;
  }
  if (state === 'sheet') { if (pressed.h || padHit(3) || padHit(1) || inp.pause || inp.confirm) state = 'title'; return; }
  if (state === 'board') { if (stateT > 0.2 && (pressed.l || padHit(2) || padHit(1) || inp.pause || inp.confirm || pressed.escape)) state = 'title'; return; }

  else { player.dead += dt; player.vx = approach(player.vx, 0, 400 * dt); if (player.y < LV.killY - 60) moveEntity(player, dt); }
  for (const e of enemies) updateEnemy(e, dt);
